# Valores que NO son secretos. Los secretos (claves) los crea deploy/azure/desplegar.ps1
# en el Secret "vidacruz-secretos" desde variables de entorno; nunca van en git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vidacruz-configuracion
  namespace: vidacruz
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  VIDACRUZ_SLA_MINUTOS_CRITICO: "5"
  VIDACRUZ_SLA_MINUTOS_URGENTE: "10"
  VIDACRUZ_SLA_MINUTOS_URGENTE_2: "30"
  VIDACRUZ_SLA_MINUTOS_NO_URGENTE: "60"
  VIDACRUZ_SLA_MINUTOS_NO_URGENTE_2: "120"
  VIDACRUZ_VIGILANCIA_INTERVALO: PT30S
  VIDACRUZ_REPORTE_ZONA_HORARIA: America/Bogota
  ASISTENTE_MODELO: claude-sonnet-5-5
  ASISTENTE_UMBRAL_SIMILITUD: "0.55"
