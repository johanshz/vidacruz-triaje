services:
  redis:
    image: redis:7
    command:
      - sh
      - -c
      - >-
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        else
          exec redis-server --appendonly yes;
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  topic-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic triaje.eventos --partitions 3 --replication-factor 1"]
    restart: "no"

  asistente:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ASISTENTE_API_KEY: ${ASISTENTE_API_KEY:?Define ASISTENTE_API_KEY en .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASISTENTE_MODELO: ${ASISTENTE_MODELO:-claude-sonnet-5-5}
      ASISTENTE_UMBRAL_SIMILITUD: ${ASISTENTE_UMBRAL_SIMILITUD:-0.75}
      ASISTENTE_TOP_K: ${ASISTENTE_TOP_K:-3}
      ASISTENTE_IA_TIMEOUT: ${ASISTENTE_IA_TIMEOUT:-10s}
      ASISTENTE_IA_VENTANA: ${ASISTENTE_IA_VENTANA:-10}
      ASISTENTE_IA_MINIMO_LLAMADAS: ${ASISTENTE_IA_MINIMO_LLAMADAS:-5}
      ASISTENTE_IA_PORCENTAJE_FALLOS: ${ASISTENTE_IA_PORCENTAJE_FALLOS:-50}
      ASISTENTE_IA_ESPERA_ABIERTO: ${ASISTENTE_IA_ESPERA_ABIERTO:-30s}
      ASISTENTE_IA_LLAMADAS_SEMIABIERTO: ${ASISTENTE_IA_LLAMADAS_SEMIABIERTO:-2}
    ports:
      - "8082:8080"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  redis-data:
